# Reads variables from the local .env file automatically (Compose interpolation).
# Run:  docker compose up --build
services:
  healthagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public, build-time-inlined frontend values (baked into the JS bundle).
        GOOGLE_MAPS_PLATFORM_KEY: ${GOOGLE_MAPS_PLATFORM_KEY:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}
    image: healthagent:latest
    container_name: healthagent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Backend runtime secrets/config — NOT baked into the image.
      NODE_ENV: production
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_API_KEY: ${SUPABASE_SECRET_API_KEY:-}
      # Only needed behind a TLS-intercepting proxy. Points to the in-container
      # path of the CA bundle mounted below (see the commented volume).
      # EXTRA_CA_CERTS: /certs/ca-bundle.pem
    # Uncomment to provide a corporate CA bundle to the container at runtime.
    # Replace the host path with your own PEM file.
    # volumes:
    #   - C:/Users/uie83312/corp-ca/win-ca-bundle.pem:/certs/ca-bundle.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # LLM-as-judge integration tests. Only runs when the `test` profile is enabled,
  # so a normal `docker compose up` is unaffected. It waits for `healthagent` to
  # become healthy, then runs the suite against it.
  #
  # Run:  docker compose --profile test up --build \
  #         --abort-on-container-exit --exit-code-from integration-tests
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    image: healthagent-tester:latest
    container_name: healthagent-tests
    profiles: ["test"]
    depends_on:
      healthagent:
        condition: service_healthy
    environment:
      # Judge needs a Gemini key (separate from the server's runtime key).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Point the runner at the server service on the compose network.
      BASE_URL: http://healthagent:3000
    command: ["npm", "run", "test:integration"]
    restart: "no"
